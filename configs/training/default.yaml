# @package _global_
training:
  max_steps: 160000
  log_every_n_steps: 10
  save_every_n_steps: 1000
  checkpoint_dir: ${paths.run_dir}/checkpoints
  resume_checkpoint_path: null
  dataloader:
    _target_: disco.training.data.create_preprocessed_dataloader
    manifest_path: null
    batch_size: 1
    shuffle: true
    num_workers: 0
    drop_last: false
    pin_memory: true
    validate: true
    weighted_sampling: false
  sequence_conditioning_mode: scheduler
  gradient_clip_norm: 10.0
  ema_decay: 0.999
  optimizer:
    lr: 0.00018
    betas: [0.9, 0.95]
    weight_decay: 1e-8
  scheduler:
    warmup_steps: 1000
    decay_factor: 0.95
    decay_every_n_steps: 50000
  loss_weights:
    sequence: 1.0
    mse: 4.0
    smooth_lddt: 4.0
    distogram: 0.03
